name: Build Tonkeeper iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Provision dummy Firebase config if missing
        run: |
          mkdir -p Keeper/Resources/Firebase/Keeper
          mkdir -p Keeper/Resources/Firebase/KeeperDebug
          
          DUMMY_PLIST='<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CLIENT_ID</key>
            <string>000000000000-dummy.apps.googleusercontent.com</string>
            <key>REVERSED_CLIENT_ID</key>
            <string>com.googleusercontent.apps.000000000000-dummy</string>
            <key>API_KEY</key>
            <string>AIzaSyDummyKeyForBuildOnly</string>
            <key>GCM_SENDER_ID</key>
            <string>000000000000</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>com.tonkeeper.app</string>
            <key>PROJECT_ID</key>
            <string>tonkeeper-dummy</string>
            <key>STORAGE_BUCKET</key>
            <string>tonkeeper-dummy.appspot.com</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <true/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:0000000000000000000000</string>
          </dict>
          </plist>'

          if [ ! -f "Keeper/Resources/Firebase/Keeper/GoogleService-Info.plist" ]; then
            echo "$DUMMY_PLIST" > Keeper/Resources/Firebase/Keeper/GoogleService-Info.plist
          fi
          if [ ! -f "Keeper/Resources/Firebase/KeeperDebug/GoogleService-Info.plist" ]; then
            echo "$DUMMY_PLIST" > Keeper/Resources/Firebase/KeeperDebug/GoogleService-Info.plist
          fi

      - name: Build iOS Simulator App
        run: |
          xcodebuild \
            -project Keeper.xcodeproj \
            -scheme Keeper \
            -configuration KeeperDebug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            build | xcbeautify || xcodebuild \
            -project Keeper.xcodeproj \
            -scheme Keeper \
            -configuration KeeperDebug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            build

      - name: Create Simulator App Package (.zip)
        run: |
          mkdir -p output
          APP_PATH=$(find build/DerivedData -name "Keeper.app" | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cd "$(dirname "$APP_PATH")"
            zip -r "$GITHUB_WORKSPACE/output/Keeper-Simulator.app.zip" "Keeper.app"
          else
            echo "Keeper.app not found!"
            exit 1
          fi

      - name: Build iOS Device App (.ipa)
        run: |
          xcodebuild \
            -project Keeper.xcodeproj \
            -scheme Keeper \
            -configuration KeeperDebug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedDataDevice \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

          APP_PATH=$(find build/DerivedDataDevice -name "Keeper.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Device Keeper.app not found!"
            exit 1
          fi

          mkdir -p output/Payload
          cp -R "$APP_PATH" output/Payload/
          cd output
          zip -r Keeper.ipa Payload
          rm -rf Payload

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Keeper-iOS-Builds
          path: output/*
